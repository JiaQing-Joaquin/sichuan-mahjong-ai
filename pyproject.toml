[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sichuan-mahjong"
version = "0.1.0"
description = "Sichuan Mahjong (血战到底) rule engine and rule-based AI baseline"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
train = ["numpy>=1.24", "torch>=2.0"]
dev = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sichuan_mahjong = ["py.typed"]
